name: Atualizar Dados BCB

on:
  schedule:
    # Horário de Brasília = UTC-3, então 14:xx BRT = 17:xx UTC.
    # OBS: o cron do GitHub tem intervalo MÍNIMO de 5 min, NÃO é preciso ao segundo
    # e sob carga chega a DESCARTAR execuções agendadas (sem erro). Por isso:
    #   1) o disparo PRINCIPAL não é este cron e sim a tarefa local do Windows
    #      (dispatch.ps1, qua/qui 14:28) — ela é pontual ao segundo. O retry
    #      (sondagem de 20 em 20s) é feito DENTRO do job pelo auto_update.py;
    #   2) usamos VÁRIAS janelas espalhadas por ~1h como rede de segurança;
    #   3) evitamos minutos redondos (:00/:30/:45) — são os mais concorridos e os
    #      que o GitHub mais descarta. Minutos "quebrados" caem com menos frequência.
    # Como o auto_update.py só publica se a data diária avançou (senão exit 2, sem
    # commit), rodar várias vezes é idempotente e barato. Quarta (3) e quinta (4)
    # cobrem feriado de quarta sem precisar de calendário.
    - cron: '31 17 * * 3,4'    # ~14:31 BRT (janela principal)
    - cron: '46 17 * * 3,4'    # backup 1
    - cron: '6 18 * * 3,4'     # backup 2
    - cron: '36 18 * * 3,4'    # backup 3
  workflow_dispatch:            # rodar manualmente pelo GitHub (aba Actions -> Run workflow)

# Serializa execuções (evita corrida de push entre os disparos das várias janelas).
concurrency:
  group: atualizar-dados-bcb
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Buscar dados (retry a cada 20s) e gerar HTML
        id: update
        env:
          # A tarefa local (dispatch.ps1) dispara 14:28; o runner sobe e o python
          # começa a sondar ~14:28:30, ANTES do BCB publicar. Sondando de 20 em 20s
          # pegamos a publicação em até 20s (e não até 60s como antes).
          # 24 x 20s = 8 min de janela -> cobre 14:28:30 até ~14:36:30.
          MAX_ATTEMPTS: '24'
          RETRY_INTERVAL: '20'
          INITIAL_DELAY: '5'
        run: |
          set +e
          python auto_update.py
          echo "code=$?" >> "$GITHUB_OUTPUT"
          set -e

      - name: Publicar
        if: steps.update.outputs.code == '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html data/cambio_data.json
          git commit -m "Atualizar dados BCB $(date -u '+%d/%m/%Y %H:%M UTC')"
          git pull --rebase --autostash
          git push

      - name: Sem dado novo
        if: steps.update.outputs.code == '2'
        run: echo "Nenhum dado novo nesta janela — nada publicado."

      - name: Falha
        if: steps.update.outputs.code != '0' && steps.update.outputs.code != '2'
        run: |
          echo "auto_update.py falhou (exit ${{ steps.update.outputs.code }})."
          exit 1
